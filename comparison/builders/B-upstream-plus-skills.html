<!DOCTYPE html>
<html lang="en" data-state="funded">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home money</title>
<meta name="description" content="Home in its funded state, with loading and pending-deposit states selected by URL hash.">
<script>
  (function () {
    var root = document.documentElement;
    function apply() {
      var h = (location.hash || '').replace('#', '');
      root.setAttribute('data-state', h === 'loading' || h === 'pending' ? h : 'funded');
    }
    apply();
    window.addEventListener('hashchange', apply);
  })();
</script>

/* ==========================================================================
   Base

  position: relative;

}

}

/* State switching: only the hash decides. */
:root:not([data-state="loading"]) .st-loading { display: none !important; }

/* ==========================================================================

.h-btn {

  min-height: var(--h-hit-lg); padding: 0 var(--h-s-4);

.h-row {
  position: relative;
  display: flex; align-items: center; gap: var(--h-s-3);
  width: 100%; min-height: var(--h-row);
  padding: var(--h-s-2) var(--h-s-4);

.h-rows > li + li > .h-row::before {

}

.h-row-desc {

.h-pill {

:root[data-motion="reduce"] .h-btn:active, :root[data-motion="reduce"] .h-iconbtn:active { transform: none; }

<body>
<div class="h-screen">

  <header class="h-topbar">
    <h1 class="sr-only">Home</h1>
    <button class="h-iconbtn" type="button" aria-label="Account">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="8.5" r="4"/>
        <path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/>
      </svg>
    </button>
  </header>

  <main class="h-main" id="main">

    <!-- Hero: net position -->
    <section class="h-hero" aria-labelledby="net-label">
      <p class="h-hero-label" id="net-label">Net position</p>

      <p class="h-hero-amount h-num st-live"><span class="sr-only">1,250 dollars and 0 cents</span><span aria-hidden="true">$1,250<span class="h-cents">.00</span></span></p>
      <p class="h-hero-amount st-loading" aria-hidden="true"><span class="h-skeleton"></span></p>
